name: Manual Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install NASM and Meson
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm meson

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: 3.47.5

    - name: Init environment
      run: ./init.sh

    - name: Build APK
      run: ./build.sh apk --flavor dev

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: flutter-apk
        path: build/app/outputs/flutter-apk/*.apk
